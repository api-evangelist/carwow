aid: carwow
name: Carwow
description: 'Carwow is a UK-based online automotive marketplace that helps consumers
  buy, sell, lease, and finance cars without haggling or hidden fees. Buyers browse
  new and used car deals, compare dealer quotes, arrange leasing (including salary
  sacrifice and fleet through Carwow Leasey), find electric-vehicle deals, and access
  vehicle financing and credit brokering. Sellers get free car valuations, part-exchange,
  and van sales. Carwow also publishes professional car reviews and ratings, runs a
  large YouTube channel, and offers comparison tools, EV charging maps, a car history
  checker, and insurance services. Founded in London and backed by Accel, Balderton
  Capital, and Bessemer Venture Partners, Carwow operates across the UK and Europe.
  It maintains a public GitHub organization of open-source engineering tooling but
  does not currently publish a public developer API.'
